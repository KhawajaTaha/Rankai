# Production stack for one small VPS: Postgres + app + worker + Caddy (automatic HTTPS).
#   1. Copy .env.example to .env and fill it (APP_MODE=live, APP_URL=https://$DOMAIN, keys...)
#   2. Set DOMAIN and POSTGRES_PASSWORD in .env
#   3. docker compose -f docker-compose.prod.yml up -d --build
#   4. docker compose -f docker-compose.prod.yml exec app npm run setup:live   (first admin account)
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rankai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rankai
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rankai"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rankai:${POSTGRES_PASSWORD}@db:5432/rankai
      RUN_WORKER_IN_PROCESS: "false"
      NODE_ENV: production
    volumes: [uploads:/app/uploads]
    depends_on: { db: { condition: service_healthy } }
    command: sh -c "npx prisma db push --skip-generate && npx next start -p 3000"

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rankai:${POSTGRES_PASSWORD}@db:5432/rankai
      NODE_ENV: production
    volumes: [uploads:/app/uploads]
    depends_on: { db: { condition: service_healthy } }
    command: npx tsx src/worker/index.ts

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
